[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "strokefont"
version = "0.1.0"
description = "TRIUMF / Physica vaxfont.dat stroke fonts for matplotlib"
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.21",
    "matplotlib>=3.7",
]
keywords = ["matplotlib", "fonts", "stroke-font", "vector-font", "physics", "triumf", "physica"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Visualization",
    "Topic :: Text Processing :: Fonts",
]

[project.optional-dependencies]
dev = [
    "build>=1.0",
    "pytest>=7.0",
]

[tool.hatch.build.hooks.custom]

[tool.hatch.build.targets.wheel]
packages = ["src/strokefont"]
# The font library is git-ignored but may be bundled for private installations.
artifacts = ["src/strokefont/data/vaxfont.dat"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/examples",
    "/docs/api.md",
    "/README.md",
    "/LICENSE",
    "/pyproject.toml",
]
artifacts = ["src/strokefont/data/vaxfont.dat"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
